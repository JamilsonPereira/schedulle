spring:
  application:
    name: agenda-fono
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agenda}
    username: ${DB_USER:agenda}
    password: ${DB_PASSWORD:agenda}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true   # erros no formato RFC 9457
  servlet:
    multipart:
      max-file-size: 10MB     # anexos de pacientes
      max-request-size: 11MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Configurações da WhatsApp Cloud API (valores reais vêm de variáveis de ambiente)
whatsapp:
  verify-token: ${WHATSAPP_VERIFY_TOKEN:dev-verify-token}
  app-secret: ${WHATSAPP_APP_SECRET:dev-app-secret}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  api-version: ${WHATSAPP_API_VERSION:v23.0}
  graph-base-url: ${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com}

# Módulo pacientes
pacientes:
  versao-consentimento-atual: ${PACIENTES_VERSAO_CONSENTIMENTO:2026-09-v1}
  diretorio-anexos: ${ANEXOS_DIR:./dados/anexos}   # armazenamento local (dev); S3 em produção
  fuso: America/Sao_Paulo

# Bot de agendamento (Passo 4)
bot:
  politica-privacidade-url: ${BOT_POLITICA_URL:https://agendafono.com.br/privacidade}

# Segurança (ADR-08). Em produção, chaves e token de plataforma vêm do Secrets Manager.
seguranca:
  emissor: agenda-fono
  validade-acesso: PT15M
  validade-refresh: P7D
  chave-privada-pem: ${JWT_CHAVE_PRIVADA_PEM:}
  chave-publica-pem: ${JWT_CHAVE_PUBLICA_PEM:}
  token-plataforma: ${PLATAFORMA_TOKEN:}
  tentativas-antes-do-bloqueio: 5
  tempo-bloqueio: PT15M
